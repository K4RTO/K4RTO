name: Deploy to GitHub Pages

# Auto-trigger on push is currently disabled — GitHub account is locked due to
# unrelated billing (small metered usage with no payment method on file).
# Re-enable by uncommenting `push:` once a payment method is added (Actions on
# this public repo will still cost $0). Until then, deploy via:
#   ./deploy-manual.sh
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# Lets GITHUB_TOKEN push to gh-pages
permissions:
  contents: write

# Cancel in-progress runs when a new commit comes in
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        # NEXT_PUBLIC_PROXY_URL is baked into the client bundle at build time.
        # Worker URL is public anyway; safe to hard-code.
        env:
          NEXT_PUBLIC_PROXY_URL: https://k4rto-browser-proxy.kritolsin3.workers.dev
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          cname: k4rto.com
          # Fixed commit message — avoids workflow injection via crafted head commit
          # message (e.g., backticks / $(whoami) / etc.). The source-of-truth history
          # lives on main; gh-pages is a deployment artifact.
          commit_message: "Deploy ${{ github.sha }} to gh-pages"
